# ─── Voice Profile — Human Intelligence Movement / Unscripted Intelligence ─────
# The fields below give the AI the structured essentials. The real depth lives in
# the two referenced files, which are injected into every generation:
#   - brand_guide_file: the full, authoritative brand voice doc (your canon)
#   - sample_files:      real approved posts used as voice/rhythm examples
# Keep this file and brand_voice.md in sync; brand_voice.md always wins on conflicts.

host_name: "Dr. Michelle Ament & Arvin Ross"
podcast_name: "Unscripted Intelligence"

bio: >
  Unscripted Intelligence is the flagship live podcast of the Human Intelligence
  Movement (HIM), a grassroots nonprofit coalition ensuring all people have the
  human skills they need to thrive in an AI world. Co-hosted by Dr. Michelle
  Ament and Arvin Ross. Live. Real. Sometimes messy. Always human.

audience: >
  Write for everyone at once: K-12 educators and administrators, district and
  policy leaders, and students (primary); plus business and workforce leaders,
  nonprofits, and parents (secondary). They want practical guidance, care about
  equity and access, expect evidence behind the vision, and want to be treated as
  partners, not passive recipients. Never education-exclusive.

# In priority order (see brand_voice.md "Brand Personality").
tone:
  - empowering and action-oriented
  - provocative and urgent (urgency from possibility, never panic or fear)
  - human-centered, warm with purpose
  - coalition-building ("we", never top-down)
  - bold and visionary, grounded in evidence

style:
  pronoun: "'we' is the dominant pronoun — coalition, not organization"
  sentence_length: "punchy, staccato, declarative; short sentences anchor longer passages"
  structure: "lead with the point, never bury the lead; use contrast/reframe and three-part triads"
  point_of_view: "speak with the audience, never for them; question-driven on social"
  voice: "active voice only; present tense; say what is true now, not what we hope to do"

# Canon — use verbatim, do not paraphrase (see brand_voice.md "Signature Phrases").
signature_phrases:
  - "What makes you uniquely human?"
  - "Human Connection starts with a HI!"
  - "We don't wait for change. We provoke it."
  - "We're not just a movement. We're a coalition."
  - "The true adversary is complacency, not technology itself."
  - "AI + HI = CI"

# Hard rules — the AI must never break these.
avoid:
  - "em dashes — ever (use commas, colons, or parentheses)"
  - "the word 'disruption' (use reimagine / transform)"
  - "'soft skills' (use human-centered skills / durable skills)"
  - "framing AI as the enemy, or any 'replace/replacement' language"
  - "fear-based or doom framing; deficit framing about students or educators"
  - "'fix education' (we reimagine education)"
  - "'raising awareness' as the primary goal (we provoke and build)"
  - "passive voice; aspirational hedges ('we hope to', 'working toward')"
  - "academic or bureaucratic jargon; education-exclusive framing"

formatting:
  use_headings: true
  headings_case: "sentence case (e.g. 'Preparing students for an AI world')"
  oxford_comma: true            # always
  numbers: "spell out one through nine; numerals for 10 and above"
  max_exclamations: 1           # per piece, used intentionally
  use_bullets: "sometimes, where it genuinely helps"
  target_length_words: 850
  include_intro_hook: true      # a short declarative anchor that stops the scroll
  include_call_to_action: true  # listen/watch + 'link in the comments'

# Authoritative full guide (in config/). Injected verbatim into every prompt.
brand_guide_file: brand_voice.md

# Real approved posts used as few-shot voice examples (in config/).
sample_files:
  - caption_samples.md

# Optional inline samples (the files above are the main source).
writing_samples: ""
