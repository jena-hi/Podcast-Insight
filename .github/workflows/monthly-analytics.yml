name: Monthly analytics + insights

# Runs once a month, pulls YouTube + Spotify analytics for every episode,
# regenerates the insights report, and commits the results back to the repo.
# Free on GitHub Actions (a run takes a couple of minutes).
#
# Setup: add these as repository secrets (Settings → Secrets and variables →
# Actions). Leave out any you're not using; connectors that aren't configured
# are skipped gracefully.
#   ANTHROPIC_API_KEY              (for the insights write-up)
#   YOUTUBE_API_KEY               (public stats)
#   YOUTUBE_OAUTH_CLIENT_ID       (private watch-time/retention)
#   YOUTUBE_OAUTH_CLIENT_SECRET
#   YOUTUBE_OAUTH_REFRESH_TOKEN   (printed by `podcast-insight auth youtube`)
#   SPOTIFY_DC_COOKIE             (unofficial Spotify Creators pull)
#   SPOTIFY_SHOW_ID
#   SPOTIFY_CREATORS_ANALYTICS_URL

on:
  schedule:
    - cron: "0 8 1 * *"   # 08:00 UTC on the 1st of every month
  workflow_dispatch: {}    # lets you run it manually from the Actions tab

permissions:
  contents: write          # needed to commit the updated data back

jobs:
  pull-and-report:
    runs-on: ubuntu-latest
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      YOUTUBE_OAUTH_CLIENT_ID: ${{ secrets.YOUTUBE_OAUTH_CLIENT_ID }}
      YOUTUBE_OAUTH_CLIENT_SECRET: ${{ secrets.YOUTUBE_OAUTH_CLIENT_SECRET }}
      YOUTUBE_OAUTH_REFRESH_TOKEN: ${{ secrets.YOUTUBE_OAUTH_REFRESH_TOKEN }}
      SPOTIFY_DC_COOKIE: ${{ secrets.SPOTIFY_DC_COOKIE }}
      SPOTIFY_SHOW_ID: ${{ secrets.SPOTIFY_SHOW_ID }}
      SPOTIFY_CREATORS_ANALYTICS_URL: ${{ secrets.SPOTIFY_CREATORS_ANALYTICS_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[analytics]"

      - name: Pull analytics for all episodes
        run: podcast-insight analytics pull-all

      - name: Generate insights report
        run: podcast-insight insights --stamp "$(date +%Y-%m)"

      - name: Commit results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/episodes reports
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Monthly analytics + insights ($(date +%Y-%m))"
            git push
          fi
